<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type" />
    <meta content="IE=edge,chrome=1" http-equiv="X-UA-Compatible" />
    <meta content="no" name="imagetoolbar" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🟢</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="apple-touch-icon-precomposed" href="/icon.png" />
    <link rel="apple-touch-startup-image" href="/icon.png" />
    <link rel="shortcut icon" type="image/x-icon" href="/icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Client App" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="format-detection" content="email=no" />
    <title>Client App</title>
  </head>
  <body>
    <app-store-init sender="tablet_ui" channel="default" init-keys="*" debug side-debug></app-store-init>
    <app-store-heartbeat key="tablet_ui_heartbeat" value="n/a" interval="30000" show="false"></app-store-heartbeat>
    <custom-app class="container">
      <section>
        <img class="logo" src="/images/oversite-logo.png" style="mix-blend-mode: screen" />
      </section>
      <section>
        <app-store-textfield key="user_name" value="" placeholder="Enter player name"></app-store-textfield>
      </section>
      <section>
        <app-store-button id="restart_btn" key="app_state" value="countdown">Start</app-store-button>
        <app-store-button id="end_session_btn" key="app_state" value="attract">End Session</app-store-button>
      </section>
      <section>
        <app-store-button key="score_decrement" value="1" momentary>-1</app-store-button>
        <app-store-button key="sensor_triggered" value="1" momentary>+1</app-store-button>
      </section>
      <section>
        <h2>Volume</h2>
      </section>
      <section>
        <webrtc-stream></webrtc-stream>
      </section>
    </custom-app>
    <details open>
      <summary>State Debug</summary>
      <hr />
      <buttons-for-key key="app_state_buttons"></buttons-for-key>
      <hr />
      <app-store-slider key="audio_volume" value="0" max="1" icon-audio></app-store-slider>
      <app-store-slider key="brightness" value="0" max="1" icon-brightness></app-store-slider>
    </details>
    <details>
      <summary>AppStore Events</summary>
      <hr />
      <app-store-event-table max-length="10" hide-filters></app-store-event-table>
    </details>
    <script type="module" src="./src/js/ui.js"></script>
  </body>
</html>
