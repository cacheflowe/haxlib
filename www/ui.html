<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type" />
    <meta content="IE=edge,chrome=1" http-equiv="X-UA-Compatible" />
    <meta content="no" name="imagetoolbar" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🟢</text></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="apple-touch-icon-precomposed" href="/icon.png" />
    <link rel="apple-touch-startup-image" href="/icon.png" />
    <link rel="shortcut icon" type="image/x-icon" href="/icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Client App" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="format-detection" content="email=no" />
    <title>Client App</title>
  </head>
  <body>
    <app-store-init sender="tablet_ui" channel="default" init-keys="*" debug side-debug></app-store-init>
    <app-store-heartbeat key="tablet_ui_heartbeat" value="n/a" interval="30000" show="false"></app-store-heartbeat>
    <custom-app class="container">
      <section>
        <img class="logo" src="/images/oversite-logo.png" style="mix-blend-mode: screen" />
      </section>
      <section>
        <app-store-textfield key="user_name" value="" placeholder="Enter player name"></app-store-textfield>
      </section>
      <section>
        <app-store-button id="restart_btn" key="app_state" value="countdown">Start</app-store-button>
        <app-store-button id="end_session_btn" key="app_state" value="attract">End Session</app-store-button>
      </section>
      <section>
        <app-store-button key="score_decrement" value="1" momentary>-1</app-store-button>
        <app-store-button key="sensor_triggered" value="1" momentary>+1</app-store-button>
      </section>
      <section>
        <h2>Volume</h2>
        <div class="volume-container">
          <div class="volume-svg">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 69 52" fill="#ffffff">
              <path
                d="M37.38 3.142v45.501c0 2.612-3.003 4.08-5.063 2.476L15.252 37.844H4.095A4.092 4.092 0 0 1 0 33.75V18.035c0-2.26 1.83-4.095 4.095-4.095h11.16L32.318.666c2.06-1.602 5.062-.133 5.062 2.476Z"
              />
              <path
                d="M47.656 39.883a3.045 3.045 0 0 1-2.037-5.31c2.48-2.23 3.903-5.392 3.903-8.675 0-3.282-1.423-6.444-3.903-8.674a3.046 3.046 0 0 1 4.072-4.53c3.763 3.384 5.921 8.197 5.921 13.204 0 5.008-2.158 9.82-5.921 13.204-.582.524-1.31.78-2.035.78Z"
              />
              <path
                d="M57.49 49.328a3.046 3.046 0 0 1-2.216-5.134c4.998-5.305 7.64-11.633 7.64-18.3 0-6.666-2.642-12.994-7.64-18.299a3.046 3.046 0 0 1 4.433-4.177c6.083 6.457 9.298 14.229 9.298 22.476 0 8.248-3.215 16.02-9.298 22.477-.599.635-1.407.957-2.217.957Z"
              />
            </svg>
          </div>
          <app-store-slider key="audio_volume" value="0" max="1"></app-store-slider>
        </div>
      </section>
    </custom-app>
    <details>
      <summary>State Debug</summary>
      <hr />
      <app-store-button key="app_state" value="attract">Attract</app-store-button>
      <app-store-button key="app_state" value="countdown">Countdown</app-store-button>
      <app-store-button key="app_state" value="gameplay">Gameplay</app-store-button>
      <app-store-button key="app_state" value="game_over">Game Over</app-store-button>
    </details>
    <details>
      <summary>AppStore Events</summary>
      <hr />
      <app-store-event-table max-length="10" hide-filters></app-store-event-table>
    </details>
    <script type="module" src="./src/js/ui.js"></script>
  </body>
</html>
